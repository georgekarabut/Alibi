<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Алиби — диагностика v3</title>
  <style>
    body { margin: 16px; background: #151e38; color: #eee; font: 14px/1.45 monospace; }
    h1 { font-size: 20px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    button { font: inherit; padding: 10px 16px; margin: 0 8px 12px 0; border-radius: 8px; border: 1px solid #c2a56a; background: #c2a56a; color: #151e38; }
    .ok { color: #8fd18f; } .bad { color: #ff8a80; }
  </style>
</head>
<body>
  <h1>Диагностика v3</h1>
  <p>Подождите, пока внизу появится «ГОТОВО» (до минуты), затем нажмите «Скопировать» и пришлите текст или скриншот всего журнала.</p>
  <button id="copy" type="button">Скопировать журнал</button>
  <pre id="log"></pre>
  <script>
  (async () => {
    const out = document.querySelector('#log'), lines = [];
    const log = (s, cls) => {
      lines.push(s);
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = s + '\n';
      out.append(span);
    };
    document.querySelector('#copy').onclick = () => navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Скопировано'), () => alert('Не вышло — пришлите скриншот'));
    const timeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(Error('ТАЙМАУТ ' + ms / 1000 + ' с')), ms))]);
    const img = (src, cors) => new Promise((ok, no) => {
      const i = new Image();
      if (cors) i.crossOrigin = 'anonymous';
      i.onload = () => ok(i.naturalWidth + 'x' + i.naturalHeight);
      i.onerror = () => no(Error('onerror'));
      i.src = src;
    });
    const t0 = performance.now(), ms = () => Math.round(performance.now() - t0);

    // 1. Окружение. Без WebAssembly и WebGL это почти наверняка «Режим блокировки» (Lockdown Mode)
    log('UA ' + navigator.userAgent);
    log('Адрес ' + location.href);
    log('DPR ' + devicePixelRatio + ', экран ' + screen.width + 'x' + screen.height);
    const wasm = typeof WebAssembly !== 'undefined';
    let webgl = false;
    try { webgl = !!document.createElement('canvas').getContext('webgl'); } catch {}
    log('WebAssembly ' + (wasm ? 'есть' : 'НЕТ'), wasm ? 'ok' : 'bad');
    log('WebGL ' + (webgl ? 'есть' : 'НЕТ'), webgl ? 'ok' : 'bad');
    log('DecompressionStream ' + (window.DecompressionStream ? 'есть' : 'НЕТ'));
    if (!wasm && !webgl) log('=> Похоже, на телефоне включён Режим блокировки (Lockdown Mode)', 'bad');

    // 2. Расшифровка форматов без сети: крошечные картинки прямо в коде страницы
    const samples = {
      'PNG': 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
      'WebP lossy': 'data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA',
      'WebP lossless': 'data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==',
      'WebP alpha': 'data:image/webp;base64,UklGRkoAAABXRUJQVlA4WAoAAAAQAAAAAAAAAAAAQUxQSAwAAAARBxAR/Q9ERP8DAABWUDggGAAAABQBAJ0BKgEAAQAAAP4AAA3AAP7mtQAAAA=='
    };
    log('\n--- Форматы без сети ---');
    for (const [name, src] of Object.entries(samples))
      await timeout(img(src), 5000).then(r => log('ФОРМАТ OK ' + name + ' ' + r, 'ok'), e => log('ФОРМАТ ОШИБКА ' + name + ' ' + e.message, 'bad'));

    // 3. Каждый файл с обоих хостов: скачивание (fetch) отдельно от показа (Image)
    const hosts = { 'этот сайт': '', 'GitHub': 'https://georgekarabut.github.io/Alibi/' };
    const files = ['assets/images/favicon-32.png', 'assets/images/logo-header.webp', 'assets/images/game-after.webp', 'assets/images/game-locks.webp', 'assets/images/game-locks-map.png'];
    for (const [host, base] of Object.entries(hosts)) {
      log('\n--- ' + host + (base ? ' (' + base + ')' : '') + ' ---');
      for (const f of files) {
        const name = f.split('/').pop(), url = base + f + '?d=' + Date.now();
        let blob = null;
        const a = ms();
        await timeout(fetch(url, { cache: 'no-store', mode: 'cors' }).then(async r => {
          blob = await r.blob();
          log('СКАЧАН ' + name + ' HTTP ' + r.status + ' ' + blob.size + ' Б ' + blob.type + ' за ' + (ms() - a) + ' мс', r.ok ? 'ok' : 'bad');
        }), 20000).catch(e => log('НЕ СКАЧАН ' + name + ' ' + e.message + ' за ' + (ms() - a) + ' мс', 'bad'));
        if (blob) {
          const u = URL.createObjectURL(blob);
          await timeout(img(u), 10000).then(r => log('  показ из скачанного OK ' + r, 'ok'), e => log('  показ из скачанного ОШИБКА ' + e.message, 'bad'));
          URL.revokeObjectURL(u);
        }
        await timeout(img(url, !!base), 20000).then(r => log('  показ по ссылке OK ' + r, 'ok'), e => log('  показ по ссылке ОШИБКА ' + e.message, 'bad'));
      }
    }
    // 4. Сама игра: страница сайта во фрейме, ошибки ловим до запуска её скриптов
    log('\n--- Игра ---');
    try {
      const html = await (await fetch('./?d=' + Date.now(), { cache: 'no-store' })).text();
      const patched = html
        .replace(".catch(() => box.classList.add('is-failed'))", ".catch(e => { box.classList.add('is-failed'); window.__gameError = String(e && (e.stack || e.message || e)); })")
        .replace('<head>', '<head><base href="' + new URL('./', location.href).href + '">');
      log('Страница ' + html.length + ' Б, перехват ошибки ' + (patched.includes('__gameError') ? 'стоит' : 'НЕ встал'));
      const frame = document.createElement('iframe');
      frame.style.cssText = 'width:100%;height:700px;border:1px solid #c2a56a';
      document.body.append(frame);
      const w = frame.contentWindow, errors = [];
      w.addEventListener('error', e => errors.push('error: ' + e.message + ' @' + e.lineno));
      w.addEventListener('unhandledrejection', e => errors.push('rejection: ' + String(e.reason && (e.reason.stack || e.reason))));
      const a = ms();
      frame.contentDocument.open();
      frame.contentDocument.write(patched);
      frame.contentDocument.close();
      let box, last = '';
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 500));
        box = frame.contentDocument.querySelector('.hero-game');
        const cv = box && box.querySelector('canvas');
        const s = box ? box.className + ' холст ' + cv.width + 'x' + cv.height + ' блок ' + Math.round(box.getBoundingClientRect().width) + 'x' + Math.round(box.getBoundingClientRect().height) : 'блока игры нет';
        if (s !== last) log('  ' + (ms() - a) + ' мс: ' + (last = s));
        if (/is-ready|is-failed/.test(s)) break;
      }
      if (w.__gameError) log('ОШИБКА ИГРЫ ' + w.__gameError, 'bad');
      errors.forEach(e => log('  ' + e, 'bad'));
      if (box && box.classList.contains('is-ready')) {
        const cv = box.querySelector('canvas'), k = cv.getContext('2d');
        const p = k.getImageData(cv.width >> 1, cv.height >> 1, 1, 1).data;
        log('ИГРА ЗАПУСТИЛАСЬ, пиксель в центре холста rgba(' + [...p].join(',') + ')', 'ok');
      } else if (box && !box.classList.contains('is-failed')) log('Игра не дошла ни до успеха, ни до ошибки за 30 с', 'bad');
    } catch (e) {
      log('Не удалось запустить игру во фрейме: ' + e, 'bad');
    }
    log('\nГОТОВО за ' + Math.round(ms() / 1000) + ' с');
  })();
  </script>
</body>
</html>
