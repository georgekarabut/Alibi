<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Алиби — диагностика v2</title><style>body{margin:16px;background:#151e38;color:#eee;font:14px monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere}canvas{max-width:100%;height:auto;border:1px solid #c2a56a}iframe{width:100%;height:650px;border:1px solid #c2a56a}</style><h1>Диагностика v2</h1><p>Подождите 35 секунд и пришлите журнал. Проверки выполняются независимо. Основной сайт не изменяется.</p><pre id="log"></pre><div id="samples"></div><h2>Основной сайт</h2><iframe title="Основной сайт"></iframe><script>
const log=s=>{document.querySelector('#log').textContent+=new Date().toISOString()+' '+s+'\n';};
log(navigator.userAgent);log('DPR '+window.devicePixelRatio);
window.addEventListener('error',e=>log('ERROR '+e.message));
window.addEventListener('unhandledrejection',e=>log('REJECTION '+String(e.reason)));
function checkImage(name){return new Promise(resolve=>{const im=new Image();let finished=false;const finish=s=>{if(finished)return;finished=true;clearTimeout(timer);log(s);resolve();};const timer=setTimeout(()=>finish('IMAGE TIMEOUT '+name+' (30 seconds)'),30000);im.onload=()=>{if(finished)return;log('IMAGE OK '+name+' '+im.naturalWidth+'x'+im.naturalHeight);try{const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;document.querySelector('#samples').append(cv);const ctx=cv.getContext('2d');if(!ctx)throw Error('No 2D context');ctx.drawImage(im,0,0);log('DRAW OK '+name);const px=ctx.getImageData(0,0,cv.width,cv.height);log('PIXELS OK '+name+' bytes='+px.data.length);finish('IMAGE TEST COMPLETE '+name);}catch(e){finish('CANVAS ERROR '+name+' '+String(e.stack||e));}};im.onerror=()=>finish('IMAGE ERROR '+name);im.src='assets/images/'+name;});}
Promise.all(['game-after.webp','game-locks.webp','game-locks-map.png'].map(checkImage)).then(()=>log('ALL IMAGE TESTS FINISHED'));
const frame=document.querySelector('iframe');let last='';function inspect(){try{const d=frame.contentDocument;if(!d)return;const box=d.querySelector('.hero-game');if(!box)return;const cv=box.querySelector('canvas');const r=cv.getBoundingClientRect();const status='LIVE GAME '+box.className+' canvas='+cv.width+'x'+cv.height+' CSS='+r.width+'x'+r.height;if(status!==last){log(status);last=status;}}catch(e){log('IFRAME INSPECT ERROR '+e);}}
frame.addEventListener('load',()=>{log('IFRAME LOAD EVENT (not proof of game success)');inspect();});frame.src='index.html';const poll=setInterval(inspect,2000);setTimeout(()=>{clearInterval(poll);if(!last)log('NO GAME OBSERVED IN IFRAME');log('DIAGNOSTIC WINDOW COMPLETE');},35000);
</script></html>
